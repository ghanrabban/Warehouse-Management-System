<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { font-family: sans-serif; font-size: 12px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { border: 1px solid #333; padding: 4px; }
    th { background: #eee; }
    .center { text-align: center; }
  </style>
</head>
<body>
  <h1>Warehouse Events Report</h1>
  <table>
    <thead>
      <tr>
        <th>Code</th>
        <th>Source</th>
        <th>User</th>
        <th>Shift</th>
        <th>When</th>
      </tr>
    </thead>
    <tbody>
    {% for e in events %}
      <tr>
        <td>{{ e.code }}</td>
        <td>{{ e.get_source_display }}</td>
        <td>
          {% if e.user %}
            {{ e.user.username }}
          {% else %}
            &mdash;
          {% endif %}
        </td>
        <td>{{ e.get_shift_display }}</td>
        <td>{{ e.created_at }}</td>
      </tr>
    {% empty %}
      <tr><td colspan="5" class="center">No events found.</td></tr>
    {% endfor %}
    </tbody>
  </table>
</body>
</html>
